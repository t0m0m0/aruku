name: Deploy Web (Cloudflare Pages)

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'l10n.yaml'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:

# プレビュー配信（PR ごとの *.pages.dev）を意図的に作らない。プレビューは
# 本番と同じ MAPS_WEB_API_KEY を焼いた成果物になるが、リファラー制限は
# デプロイごとに変わるサブドメインを追随できず、`*.pages.dev` を許可すれば
# 他人の Pages プロジェクトからも使えるキーになる（docs/security_hardening.md ①）。

env:
  # ci.yml と同じ版に固定する。版が割れると CI が緑のまま配信物だけ壊れうる。
  FLUTTER_VERSION: 3.38.5
  # Cloudflare Pages のプロジェクト名。dashboard か `wrangler pages project create` で
  # 作った名前と一致させる（README「Web 公開（Cloudflare Pages）」）。
  PAGES_PROJECT: aruku

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    # deploy-functions.yml と同じ環境に載せ、本番へ出る経路の承認を一本化する。
    # 注意: 承認は Environment 側で required reviewers を設定して初めて発動する。
    environment: production
    env:
      FIREBASE_WEB_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
      FIREBASE_WEB_APP_ID: ${{ secrets.FIREBASE_WEB_APP_ID }}
      RECAPTCHA_SITE_KEY: ${{ secrets.RECAPTCHA_SITE_KEY }}
      MAPS_WEB_API_KEY: ${{ secrets.MAPS_WEB_API_KEY }}
      PROXY_BASE_URL: ${{ vars.PROXY_BASE_URL }}
    steps:
      - uses: actions/checkout@v6

      # 空の dart-define はコンパイルを通り、壊れるのは実行時（Firebase 初期化・
      # App Check・地図読み込み）。release では assert が落ちて main.dart 側の
      # 検査も効かないため、配信前に落とせるのはここだけ。
      - name: Verify required configuration
        run: |
          missing=()
          for name in FIREBASE_WEB_API_KEY FIREBASE_WEB_APP_ID \
                      RECAPTCHA_SITE_KEY MAPS_WEB_API_KEY PROXY_BASE_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -ne 0 ]; then
            echo "::error::missing secrets/variables: ${missing[*]}"
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # ci.yml とは別ワークフローで、CI の緑を待たずに走る。配信物にだけ
      # 退行が乗るのを防ぐため、deploy-functions.yml と同じくここでも検査する。
      - name: Run tests
        run: flutter test

      - name: Build web
        run: >-
          flutter build web --release
          --dart-define=USE_REAL_MAP=true
          --dart-define=FIREBASE_WEB_API_KEY="$FIREBASE_WEB_API_KEY"
          --dart-define=FIREBASE_WEB_APP_ID="$FIREBASE_WEB_APP_ID"
          --dart-define=RECAPTCHA_SITE_KEY="$RECAPTCHA_SITE_KEY"
          --dart-define=MAPS_WEB_API_KEY="$MAPS_WEB_API_KEY"
          --dart-define=PROXY_BASE_URL="$PROXY_BASE_URL"

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch を明示するのは、wrangler が git から推測した名前が main と
          # 食い違うと本番配信ではなくプレビュー扱いになるため。
          command: >-
            pages deploy build/web
            --project-name=${{ env.PAGES_PROJECT }}
            --branch=main
