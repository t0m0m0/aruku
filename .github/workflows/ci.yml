name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: engine typecheck / test (packages/engine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: packages/engine/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: packages/engine

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: packages/engine

      - name: Test
        run: npm test
        working-directory: packages/engine

      # `npm test` とは別に要る。素の vitest は「落ちているテストがあるか」しか答えず、
      # **移植されていないテストがあるか**には答えない——移植漏れは vitest から見れば
      # 存在しないファイルでしかなく静かに緑になる。ここは Dart 側と名前で1対1かだけを
      # 見る（PR #389 レビュー・packages/engine/PORTING.md「CI での扱い」）。
      - name: Check ported suite
        run: npm run check:port
        working-directory: packages/engine

  web:
    name: web typecheck / test / build (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      - name: Typecheck
        run: npx tsc --noEmit
        working-directory: apps/web

      - name: Test
        run: npm test
        working-directory: apps/web

      # 型解決（tsconfig の paths）とバンドル解決（vite.config.ts の alias）は
      # 別々に書くので食い違いうる。tsc と vitest だけでは本番ビルドの解決が
      # 壊れていても気付けないため、ここで実際に束ねる。
      - name: Build
        run: npx vite build
        working-directory: apps/web

  e2e:
    name: web e2e (apps/web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: apps/web

      # ブラウザは chromium だけ入れる。ここで見ているのはアプリの配線と履歴の
      # 積み方で、描画エンジンごとの差ではない。3 種入れると取得が3倍になる。
      - name: Install browser
        run: npx playwright install --with-deps chromium
        working-directory: apps/web

      # ビルドとプレビューは playwright.config.ts の webServer が起こす。E2E 用の
      # ベース URL（偽の上流）はバンドルへ焼かれるので、ここでビルドし直さない。
      - name: E2E
        run: npm run e2e
        working-directory: apps/web

      # CI でしか出ない失敗のための軌跡（trace: 'retain-on-failure'）。手元で
      # 再現できない競合は、これが無いとログの1行しか手掛かりが残らない。
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-trace
          path: apps/web/test-results/
          retention-days: 7

  doc-consistency:
    name: doc / comment consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # doc-consistency の差分駆動の検査が base との共通祖先を要る（#357）。
          fetch-depth: 0

      - name: Doc/comment consistency
        run: |
          python3 .claude/doc_consistency_test.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .claude/doc_consistency.py --ci --base "origin/${{ github.base_ref }}"
          else
            # push でも差分駆動の検査（消えたシンボル・削除ファイル）を効かせる。
            # base を渡さないとその2つが無効になり、main への直 push が素通りする。
            # 初回 push / force push では before が空コミットを指すため素の検査へ落とす。
            BASE="${{ github.event.before }}"
            # 旧 tip と新 tip を直接比べる（--two-dot）。三点だと force push で
            # 巻き戻された削除が共通祖先の側に隠れて見えない。
            if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              python3 .claude/doc_consistency.py --ci --base "$BASE" --two-dot
            else
              python3 .claude/doc_consistency.py --ci
            fi
          fi
