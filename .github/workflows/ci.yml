name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    name: format / analyze / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # doc-consistency の差分駆動の検査が base との共通祖先を要る（#357）。
          fetch-depth: 0

      # Flutter より先に置く。python3 だけで走り、コメント・ドキュメントの
      # 取り残しは早く落ちたほうが直しやすい。
      - name: Doc/comment consistency
        run: |
          python3 .claude/doc_consistency_test.py
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 .claude/doc_consistency.py --ci --base "origin/${{ github.base_ref }}"
          else
            # push でも差分駆動の検査（消えたシンボル・削除ファイル）を効かせる。
            # base を渡さないとその2つが無効になり、main への直 push が素通りする。
            # 初回 push / force push では before が空コミットを指すため素の検査へ落とす。
            BASE="${{ github.event.before }}"
            # 旧 tip と新 tip を直接比べる（--two-dot）。三点だと force push で
            # 巻き戻された削除が共通祖先の側に隠れて見えない。
            if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
              python3 .claude/doc_consistency.py --ci --base "$BASE" --two-dot
            else
              python3 .claude/doc_consistency.py --ci
            fi
          fi

      # dart:io の新規混入は web ビルドでは捕まらない（dart2js がスタブを提供する
      # ためコンパイルは通り、触った瞬間に実行時例外になる）。静的に見るのはここ。
      - name: Web safety
        run: |
          python3 .claude/web_safety_test.py
          python3 .claude/web_safety.py

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.5
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Static analysis
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      # Web を壊す変更を出す前に落とす（#359 Phase 3）。dart-define は渡さない——
      # release ビルドでは assert が落ちるため鍵の検査は走らず、String.fromEnvironment
      # は空文字を返すだけでコンパイルは通る。CI に秘密を持ち込まずに済む。
      - name: Build web
        run: flutter build web
